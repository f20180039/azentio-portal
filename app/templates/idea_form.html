{% extends "base.html" %}{% block title %}New improvement idea{% endblock %}
{% block content %}
<div style="max-width:760px"><h1>New improvement idea</h1>
<form method="post" action="/ideas" class="card">
  <div class="field"><label for="title">Title</label><input id="title" name="title" type="text" required minlength="5" maxlength="120"></div>
  <div class="field"><label for="problem">Problem statement (internal)</label><textarea id="problem" name="problem" required minlength="10"></textarea></div>
  <div class="field"><label for="po">Proposed outcome (internal)</label><textarea id="po" name="proposed_outcome" required minlength="10" style="min-height:80px"></textarea></div>
  <div class="two">
    <div class="field"><label for="off">Offering</label><select id="off" name="offering">{% for o in offerings %}<option value="{{ o.slug }}" {% if o.slug=='financial-analysis-intelligence' %}selected{% endif %}>{{ o.name }}</option>{% endfor %}</select></div>
    <div class="field"><label for="team">Owner team</label><input id="team" name="owner_team" type="text" required value="Financial Analysis squad"></div>
    <div class="field"><label for="pr">Priority</label><select id="pr" name="priority">{% for p in priorities %}<option {% if p=='Medium' %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></div>
    <div class="field"><label for="st">Status</label><select id="st" name="status">{% for s in statuses %}<option {% if s=='Under review' %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
  </div>
  <fieldset><legend>Supporting themes</legend>
  {% for t in themes if t.meets_cohort %}<label class="check"><input type="checkbox" name="theme_ids" value="{{ t.id }}" {% if t.id==selected %}checked{% endif %}> {{ t.name }} ({{ t.organisations }} organisations)</label>{% endfor %}</fieldset>
  <div class="field"><label for="note">Update shown to clients</label><input id="note" name="public_note" type="text" maxlength="300" value="Being assessed; not a committed delivery."><p class="hint">Do not mention client names, private tickets or unapproved delivery dates.</p></div>
  <button class="btn">Create idea</button>
</form></div>
{% endblock %}
