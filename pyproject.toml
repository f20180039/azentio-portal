[project]
name = "azentio-portal"
version = "0.1.0"
description = "azentio.ai website and governed collaboration portal (hackathon build)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "jinja2==3.1.4",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.10.1",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
